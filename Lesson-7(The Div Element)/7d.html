<!-- Create a design using a <div> with two pragraph inside -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div Element</title>
    <style>
        .div1{
            background-color:  rgb(56, 55, 55);
            width: 320px;
        } 
        .p1{
            color: white;
            font-weight: bold;
            font-size: 22px;
            font-family: Arial;
            padding: 15px;
            padding-bottom: 0px;
        } 
        .p2{
            color: white;
            font-family: Arial;
            font-size: 14px;
            font-weight:normal;
            padding-left: 15px;
            padding-bottom: 15px;
            padding-top: 5px; 
        }  
    </style>
</head>
<body>
    <div class="div1">
        <p class="p1">Install YouTube Music</p>
        <p class="p2">Add Youtube music to your desktop for quick and easy access</p>
    </div>
</body>
</html>
