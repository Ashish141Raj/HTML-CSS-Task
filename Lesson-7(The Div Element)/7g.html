<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question-Challenge</title>
    <style>
        .google-div{
            text-align: center;
        }
        .google-logo{
            display: block;
            width: 300px;
            margin: 0px auto;
            margin-bottom: -20px;

        }
        .search-bar{
            width: 650px;
            padding: 18px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            box-shadow: 0px 0px 6px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        .search-btn{
            background-color: rgb(245,245,245);
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            margin-right: 10px;
            cursor: pointer;
        }
        .Felling-btn{
            background-color: rgb(245,245,245);
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            margin-right: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="google-div">
        <img class="google-logo" src="google.png" alt="LOGO">
    </div>
    <div class="google-div">
        <input class="search-bar" type="text" placeholder="Search Google or type a URL">
    </div>
    <div class="google-div">
        <button class="search-btn">Google Search</button>
        <button class="Felling-btn">I'm Feeling Lucky</button>
    </div>
</body>
</html>
