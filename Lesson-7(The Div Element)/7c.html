<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div Element</title>
    <style>
        .div1{
            border: 1px solid;
            width: 350px;
            padding: 18px 15px;
        }
    </style>
</head>
<body>
    <div class="div1">
        <p>Satisfied with our service?</p>
        <button class="yes-btn">Yes</button>
        <button class="no-btn">No</button>
    </div>
</body>
</html>
